name: Jaguar
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.1.0
    SWIFT_VERSION: 6.0
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  Jaguar:
    type: application
    platform: iOS
    sources: [Sources]
    resources: [Resources]
    info:
      path: Resources/Info.plist
      properties:
        CFBundleDisplayName: Jaguar
        CFBundleIconName: AppIcon
        CFBundleIconFiles:
          - AppIcon-60
          - AppIcon-76
          - AppIcon-83.5
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLName: technology.co.beyondimagination.jaguar.auth
            CFBundleURLSchemes: [jaguar]
        LSApplicationCategoryType: public.app-category.productivity
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.jaguar
        PRODUCT_MODULE_NAME: Jaguar
        PRODUCT_NAME: Jaguar
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: YES
    scheme:
      testTargets: [JaguarTests]
  JaguarTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: Jaguar
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.jaguar.tests
        GENERATE_INFOPLIST_FILE: YES
