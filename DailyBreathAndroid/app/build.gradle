plugins { id 'com.android.application' }

dependencies {
    implementation 'com.android.billingclient:billing:6.2.1'
}

android {
    namespace 'technology.co.beyondimagination.dailybreath'
    compileSdk 37
    defaultConfig {
        applicationId 'technology.co.beyondimagination.dailybreath'
        minSdk 26
        targetSdk 37
        versionCode providers.gradleProperty('versionCode').map { it.toInteger() }.getOrElse(6)
        versionName providers.gradleProperty('versionName').getOrElse('2.1')
    }
    flavorDimensions += 'store'
    productFlavors {
        amazon {
            dimension 'store'
        }
        play {
            dimension 'store'
        }
    }
    signingConfigs {
        release {
            if (System.getenv()['CI']) {
                storeFile file(System.getenv()['CM_KEYSTORE_PATH'])
                storePassword System.getenv()['CM_KEYSTORE_PASSWORD']
                keyAlias System.getenv()['CM_KEY_ALIAS']
                keyPassword System.getenv()['CM_KEY_PASSWORD']
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (System.getenv()['CI']) {
                signingConfig signingConfigs.release
            }
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
