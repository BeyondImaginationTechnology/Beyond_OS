name: BeyondMath
options:
  bundleIdPrefix: technology.beyondimagination
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: 5.0
targets:
  BeyondMath:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources
    settings:
      base:
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        PRODUCT_BUNDLE_IDENTIFIER: technology.beyondimagination.beyondmath
        PRODUCT_NAME: Beyond Math
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: [BeyondMathTests]
  BeyondMathTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BeyondMath
