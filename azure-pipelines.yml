# DailyBreath Apple validation on an Azure-hosted macOS agent.
#
# This pipeline deliberately performs an unsigned simulator test. Keep signing,
# archiving, and TestFlight uploads in Xcode Cloud, where the app, widget, and
# App Clip can use their separately managed Apple signing profiles.
trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: macos-15

variables:
  project: DailyBreathApple/TheDailyBreath.xcodeproj
  scheme: The Daily Breath
  destination: platform=iOS Simulator,name=iPhone 16

steps:
  - checkout: self
    clean: true

  - bash: |
      set -euo pipefail
      find . -type f -name '*.php' \
        -not -path './.git/*' \
        -not -path '*/vendor/*' \
        -print0 | xargs -0 -n1 php -l
    displayName: Lint PHP platform

  - bash: |
      set -euo pipefail
      php <<'PHP'
      <?php
      session_start();
      require 'beyond-id/includes/functions.php';
      foreach (['//evil.example', '/\\evil.example', '/%5cevil.example', "\n/location"] as $unsafe) {
          if (safe_return_path($unsafe, '/fallback') !== '/fallback') throw new RuntimeException('Unsafe return path accepted: '.$unsafe);
      }
      if (safe_return_path('/dailybreath/?tab=today', '/fallback') !== '/dailybreath/?tab=today') throw new RuntimeException('Safe return path rejected.');
      if (in_array('sqlite', PDO::getAvailableDrivers(), true)) {
          $_SERVER['REMOTE_ADDR'] = '192.0.2.10';
          $pdo = new PDO('sqlite::memory:');
          if (!beyond_rate_limit_consume($pdo, 'ci-login', 'member@example.test', 2, 60, 60)['allowed']) throw new RuntimeException('First request was throttled.');
          if (!beyond_rate_limit_consume($pdo, 'ci-login', 'member@example.test', 2, 60, 60)['allowed']) throw new RuntimeException('Second request was throttled.');
          if (beyond_rate_limit_consume($pdo, 'ci-login', 'member@example.test', 2, 60, 60)['allowed']) throw new RuntimeException('Throttle did not activate.');
          beyond_rate_limit_clear($pdo, 'ci-login', 'member@example.test');
          if (!beyond_rate_limit_consume($pdo, 'ci-login', 'member@example.test', 2, 60, 60)['allowed']) throw new RuntimeException('Throttle did not clear.');
      }
      PHP
    displayName: Test authentication security helpers

  - bash: |
      set -euo pipefail
      find . -type f -name '*.js' \
        -not -path './.git/*' \
        -not -path '*/node_modules/*' \
        -print0 | xargs -0 -n1 node --check
      node - <<'NODE'
      const fs = require('fs');
      const path = require('path');
      function walk(dir) {
        for (const entry of fs.readdirSync(dir, {withFileTypes: true})) {
          if (entry.name === '.git' || entry.name === 'node_modules') continue;
          const file = path.join(dir, entry.name);
          if (entry.isDirectory()) walk(file);
          else if (entry.name.endsWith('.json')) JSON.parse(fs.readFileSync(file, 'utf8'));
        }
      }
      walk('.');
      NODE
    displayName: Validate JavaScript and JSON

  - bash: |
      set -euo pipefail
      forbidden="$(git ls-files | grep -Ei '(^|/)(config\.toml|\.env($|\.)|.*\.(pem|p8|p12|pfx|key|mobileprovision))$' || true)"
      [[ -z "$forbidden" ]] || { echo "Forbidden private files are tracked:"; echo "$forbidden"; exit 1; }
      leaked="$(git grep -IlE '(sk_live_[A-Za-z0-9]{16,}|AKIA[0-9A-Z]{16}|-----BEGIN (RSA |EC |OPENSSH )?PRIVATE KEY-----)' -- . ':!*.example.*' || true)"
      [[ -z "$leaked" ]] || { echo "Potential credential material detected in:"; echo "$leaked"; exit 1; }
    displayName: Guard secrets and deployment files

  - bash: |
      set -euo pipefail
      corepack enable
      corepack prepare pnpm@11.19.0 --activate
      for project in tools/hello-world-app-preview tools/daily-stencil-video tools/stencil-pack-remotion tools/beyond-studio-remotion beyond-chromium; do
        if [[ -f "$project/package-lock.json" ]]; then
          (cd "$project" && npm audit --package-lock-only --audit-level=high)
        elif [[ -f "$project/pnpm-lock.yaml" ]]; then
          (cd "$project" && pnpm install --frozen-lockfile --ignore-scripts && pnpm audit --audit-level=high)
        fi
      done
    displayName: Audit locked Node dependencies

  - bash: |
      set -euo pipefail
      xcodebuild -version
      xcrun simctl list devices available
    displayName: Inspect Xcode and available simulators

  - bash: |
      set -euo pipefail
      result_bundle="$(Agent.TempDirectory)/DailyBreathTests.xcresult"
      xcodebuild test \
        -project "$(project)" \
        -scheme "$(scheme)" \
        -destination "$(destination)" \
        -resultBundlePath "$result_bundle" \
        -derivedDataPath "$(Agent.TempDirectory)/DerivedData" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO
    displayName: Test DailyBreath on iPhone Simulator

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Agent.TempDirectory)/DailyBreathTests.xcresult
      artifact: DailyBreathTests-xcresult
    displayName: Publish Xcode test result bundle

  - bash: |
      set -euo pipefail
      screenshot_root="$(Build.ArtifactStagingDirectory)/DailyBreathScreenshots"
      derived="$(Agent.TempDirectory)/DailyBreathScreenshotBuild"
      mkdir -p "$screenshot_root"

      xcodebuild build \
        -project "$(project)" \
        -scheme "$(scheme)" \
        -sdk iphonesimulator \
        -configuration Debug \
        -derivedDataPath "$derived" \
        CODE_SIGNING_ALLOWED=NO \
        CODE_SIGNING_REQUIRED=NO

      app_path="$derived/Build/Products/Debug-iphonesimulator/The Daily Breath.app"
      [[ -d "$app_path" ]] || {
        echo "Simulator app was not produced at $app_path"
        exit 1
      }

      for device in "iPhone 16" "iPad Pro 13-inch (M4)"; do
        device_udid="$(xcrun simctl list devices available | awk -F '[()]' -v name="$device" '$1 ~ name {print $2; exit}')"
        if [[ -z "$device_udid" ]]; then
          echo "##vso[task.logissue type=warning]Simulator not available: $device"
          continue
        fi

        xcrun simctl boot "$device_udid" 2>/dev/null || true
        xcrun simctl bootstatus "$device_udid" -b
        xcrun simctl install "$device_udid" "$app_path"
        safe_device="$(printf '%s' "$device" | tr ' ' '-')"

        for state in today scripture breathe journal; do
          xcrun simctl launch "$device_udid" technology.co.beyondimagination.thedailybreath >/dev/null
          sleep 1
          xcrun simctl openurl "$device_udid" "dailybreath://$state"
          sleep 2
          xcrun simctl io "$device_udid" screenshot "$screenshot_root/$safe_device-$state.png"
        done

        xcrun simctl shutdown "$device_udid" || true
      done

      find "$screenshot_root" -type f -name '*.png' -print
    displayName: Capture iPhone and iPad App Store screenshots

  - task: PublishPipelineArtifact@1
    condition: succeededOrFailed()
    inputs:
      targetPath: $(Build.ArtifactStagingDirectory)/DailyBreathScreenshots
      artifact: DailyBreath-iPhone-iPad-Screenshots
    displayName: Publish iPhone and iPad screenshots

  - bash: |
      set -euo pipefail
      screenshot_root="$(Build.ArtifactStagingDirectory)/DailyBreathScreenshots"
      archive="$(Build.ArtifactStagingDirectory)/DailyBreath-iPhone-iPad-Screenshots.zip"

      if [[ ! -d "$screenshot_root" ]]; then
        echo "Screenshot directory not found; skipping email notification."
        exit 0
      fi

      ditto -c -k --sequesterRsrc --keepParent "$screenshot_root" "$archive"

      python3 - "$archive" <<'PY'
      import os
      import smtplib
      import ssl
      import sys
      from email.message import EmailMessage
      from pathlib import Path

      archive = Path(sys.argv[1])
      def configured(name, default=""):
          value = os.environ.get(name, "")
          return default if not value or value.startswith("$(") else value

      host = configured("SMTP_HOST")
      port_value = configured("SMTP_PORT", "587")
      port = int(port_value) if port_value.isdigit() else 587
      username = configured("SMTP_USERNAME")
      password = configured("SMTP_PASSWORD")
      sender = configured("SMTP_FROM", username)
      recipient = "admin@beyondimagination.co.technology"
      use_ssl = configured("SMTP_USE_SSL", "false").lower() == "true"

      message = EmailMessage()
      message["Subject"] = "DailyBreath iPhone and iPad screenshots"
      message["From"] = sender
      message["To"] = recipient
      message.set_content(
          "The DailyBreath simulator screenshot artifact is attached. "
          "It contains Today, Scripture, Breathe, and Journal captures for "
          "the available iPhone 16 and iPad Pro 13-inch (M4) simulators."
      )
      message.add_attachment(
          archive.read_bytes(),
          maintype="application",
          subtype="zip",
          filename=archive.name,
      )

      if use_ssl:
          with smtplib.SMTP_SSL(host, port, context=ssl.create_default_context()) as smtp:
              smtp.login(username, password)
              smtp.send_message(message)
      else:
          with smtplib.SMTP(host, port) as smtp:
              smtp.ehlo()
              smtp.starttls(context=ssl.create_default_context())
              smtp.ehlo()
              smtp.login(username, password)
              smtp.send_message(message)
      PY
    displayName: Email screenshot artifact via SMTP
    condition: and(succeededOrFailed(), ne(variables['SMTP_HOST'], ''), ne(variables['SMTP_PASSWORD'], ''))
    env:
      SMTP_HOST: $(SMTP_HOST)
      SMTP_PORT: $(SMTP_PORT)
      SMTP_USERNAME: $(SMTP_USERNAME)
      SMTP_PASSWORD: $(SMTP_PASSWORD)
      SMTP_FROM: $(SMTP_FROM)
      SMTP_TO: $(SMTP_TO)
      SMTP_USE_SSL: $(SMTP_USE_SSL)
