name: TheDailyBreath
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.5
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  TheDailyBreath:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    dependencies:
      - target: TheDailyBreathClip
        embed: true
      - target: DailyBreathWidget
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath
        PRODUCT_NAME: The Daily Breath
        PRODUCT_MODULE_NAME: DailyBreath
        CODE_SIGN_ENTITLEMENTS: Sources/TheDailyBreath.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Sources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - TheDailyBreathTests
  TheDailyBreathClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: AppClip
    resources:
      - path: Resources/Assets.xcassets
      - path: Resources/daily-verses.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath.Clip
        PRODUCT_NAME: The Daily Breath Clip
        PRODUCT_MODULE_NAME: DailyBreathClip
        CODE_SIGN_ENTITLEMENTS: AppClip/TheDailyBreathClip.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Daily Breath Clip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  DailyBreathWidget:
    type: app-extension
    platform: iOS
    sources:
      - path: Widget/DailyBreathWidget.swift
    resources:
      - path: Resources/daily-verses.json
      - path: Widget/PrivacyInfo.xcprivacy
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath.widget
        PRODUCT_NAME: Daily Breath Widget
        PRODUCT_MODULE_NAME: DailyBreathWidget
        CODE_SIGN_ENTITLEMENTS: Widget/DailyBreathWidget.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Widget/Info.plist
        SKIP_INSTALL: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  TheDailyBreathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TheDailyBreath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath.tests
        PRODUCT_MODULE_NAME: DailyBreathTests
        GENERATE_INFOPLIST_FILE: YES
