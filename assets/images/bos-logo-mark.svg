<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Beyond Imagination</title>
  <desc id="desc">A luminous keyhole gateway surrounded by three atomic orbits.</desc>
  <defs>
    <linearGradient id="orbit" x1="7" y1="9" x2="41" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a5ff"/>
      <stop offset=".48" stop-color="#9a6dff"/>
      <stop offset="1" stop-color="#f05ab8"/>
    </linearGradient>
    <radialGradient id="gateway" cx=".38" cy=".3" r=".8">
      <stop offset="0" stop-color="#30265f"/>
      <stop offset=".62" stop-color="#111126"/>
      <stop offset="1" stop-color="#080914"/>
    </radialGradient>
    <linearGradient id="key" x1="21" y1="18" x2="28" y2="31" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffeafa"/>
      <stop offset=".38" stop-color="#ef6bc2"/>
      <stop offset="1" stop-color="#8069ff"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g fill="none" stroke="url(#orbit)" stroke-width="1.45" stroke-linecap="round" opacity=".92">
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7"/>
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7" transform="rotate(60 24 24)"/>
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7" transform="rotate(120 24 24)"/>
  </g>
  <g fill="#efe8ff" opacity=".9">
    <circle cx="39.8" cy="22.4" r=".9"/>
    <circle cx="15.2" cy="10.8" r=".72"/>
    <circle cx="17.1" cy="38.2" r=".7"/>
  </g>
  <circle cx="24" cy="24" r="7.4" fill="url(#gateway)" stroke="url(#orbit)" stroke-width="1.15" filter="url(#glow)"/>
  <circle cx="24" cy="21.8" r="2.45" fill="url(#key)"/>
  <path d="M22.95 23.7h2.1l1.25 6.05h-4.6l1.25-6.05Z" fill="url(#key)" stroke="#f8ddf3" stroke-width=".35" stroke-linejoin="round"/>
  <path d="M21.1 17.9A7.1 7.1 0 0 1 29.7 22" fill="none" stroke="#fff" stroke-width=".65" stroke-linecap="round" opacity=".35"/>
</svg>
