<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f6f5ef">
  <title>Beyond Kitchen · You're offline</title>
  <style>
    *{box-sizing:border-box}body{min-height:100vh;display:grid;place-items:center;margin:0;padding:24px;background:#f6f5ef;color:#283126;font:16px/1.6 system-ui,sans-serif}.note{max-width:470px;padding:42px;border:1px solid #e5e4da;border-radius:24px;background:#fffefa;text-align:center}.mark{width:52px;height:52px;display:grid;place-items:center;margin:auto;border-radius:17px;color:#fff;background:#405b42;font:500 36px Georgia,serif}.eyebrow{margin:25px 0 8px;color:#78806e;font-size:11px;font-weight:700;letter-spacing:.15em;text-transform:uppercase}h1{margin:0;font:500 37px/1.1 Georgia,serif}p{color:#72766b;font-size:14px}a{display:inline-flex;margin-top:15px;padding:11px 19px;border-radius:999px;color:#fff;background:#405b42;font-size:13px;font-weight:700;text-decoration:none}
  </style>
</head>
<body>
  <main class="note">
    <div class="mark" aria-hidden="true">b</div>
    <p class="eyebrow">Beyond Kitchen</p>
    <h1>A little pause.</h1>
    <p>You’re offline right now. Your saved recipes stay on this device. Reconnect and come back for today’s inspiration.</p>
    <a href="./">Try again</a>
  </main>
</body>
</html>
