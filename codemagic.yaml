          xcodebuild build -project BeyondTattoo.xcodeproj -scheme BeyondTattoo-iOS -sdk iphonesimulator -destination "id=$simulator_id" -derivedDataPath "$CM_BUILD_DIR/derived-data" CODE_SIGNING_ALLOWED=NO
