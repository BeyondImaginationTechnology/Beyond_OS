name: BeyondFrench
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.2
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: NO
    INFOPLIST_KEY_CFBundleIconName: AppIcon
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  BeyondFrench:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources/Assets.xcassets
    resources:
      - path: Resources/Audio
        type: folder
      - path: Resources/academy.json
      - path: Resources/dictionary.json
      - path: Resources/LaunchScreen.storyboard
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondfrench
        PRODUCT_NAME: BeyondFrench
        INFOPLIST_FILE: Info.plist
        CODE_SIGN_ENTITLEMENTS: BeyondFrench.entitlements
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Beyond French
        INFOPLIST_KEY_CFBundleIconName: AppIcon
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.education
        INFOPLIST_KEY_UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets:
        - BeyondFrenchTests
  BeyondFrenchTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeyondFrench
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondfrench.tests
        GENERATE_INFOPLIST_FILE: YES
