  beyond-tattoo-android-simulator:
    name: Beyond Tattoo Android 1.2 simulator
    max_build_duration: 75
    instance_type: mac_mini_m2
    working_directory: BeyondTattooAndroid
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      java: 17
      vars:
        ANDROID_VERSION_CODE: 4
        ANDROID_VERSION_NAME: 1.2.0
    scripts:
      - name: Build the installable Android app
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties
          ./gradlew --no-daemon -PversionCode="$ANDROID_VERSION_CODE" -PversionName="$ANDROID_VERSION_NAME" assembleDebug
      - name: Launch in Android simulator
        script: |
          set -euo pipefail
          echo no | avdmanager create avd --force --name beyond-tattoo-api35 --package "system-images;android-35;google_apis;arm64-v8a"
          "$ANDROID_SDK_ROOT/emulator/emulator" -avd beyond-tattoo-api35 -no-window -no-audio -no-snapshot -gpu swiftshader_indirect > "$CM_BUILD_DIR/android-emulator.log" 2>&1 &
          adb wait-for-device
          until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
          adb install -r app/build/outputs/apk/debug/app-debug.apk
          adb shell am start -W -n technology.co.beyondimagination.beyondtattoo/.MainActivity
          adb shell dumpsys window windows | grep -q 'technology.co.beyondimagination.beyondtattoo'
    artifacts:
      - app/build/outputs/apk/debug/*.apk
      - $CM_BUILD_DIR/android-emulator.log

