name: FrenchQuest
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.1.0
    SWIFT_VERSION: 6.0
targets:
  FrenchQuest:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources/academy.json
      - path: Resources/dictionary.json
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.frenchquest
        PRODUCT_NAME: FrenchQuest
        CODE_SIGN_ENTITLEMENTS: FrenchQuest.entitlements
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - FrenchQuestTests
  FrenchQuestTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: FrenchQuest
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.frenchquest.tests
        GENERATE_INFOPLIST_FILE: YES
