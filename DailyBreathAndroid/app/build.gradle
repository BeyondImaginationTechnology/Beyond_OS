plugins { id 'com.android.application' }

android {
    namespace 'technology.co.beyondimagination.dailybreath'
    compileSdk 37
    defaultConfig {
        applicationId 'technology.co.beyondimagination.dailybreath'
        minSdk 26
        targetSdk 37
        versionCode 2
        versionName '1.7.0'
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
