name: TheDailyBreath
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 4
    MARKETING_VERSION: 1.1.3
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  TheDailyBreath:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath
        PRODUCT_NAME: The Daily Breath
        PRODUCT_MODULE_NAME: DailyBreath
        INFOPLIST_KEY_CFBundleDisplayName: The Daily Breath
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchStoryboardName: LaunchScreen
        INFOPLIST_KEY_UIRequiresFullScreen: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown"
        TARGETED_DEVICE_FAMILY: "1,2"
      configs:
        Release:
          CODE_SIGN_IDENTITY: Apple Distribution
          CODE_SIGN_STYLE: Manual
          PROVISIONING_PROFILE: 6183f7f2-d0c2-44a0-a6eb-478e47f58eb9
          PROVISIONING_PROFILE_SPECIFIER: 6183f7f2-d0c2-44a0-a6eb-478e47f58eb9
    scheme:
      testTargets:
        - TheDailyBreathTests
  TheDailyBreathClip:
    type: application.on-demand-install-capable
    platform: iOS
    sources:
      - path: AppClip
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath.Clip
        PRODUCT_NAME: The Daily Breath Clip
        PRODUCT_MODULE_NAME: DailyBreathClip
        CODE_SIGN_ENTITLEMENTS: AppClip/TheDailyBreathClip.entitlements
        INFOPLIST_KEY_CFBundleDisplayName: Daily Breath Clip
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1"
  TheDailyBreathTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: TheDailyBreath
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.thedailybreath.tests
        PRODUCT_MODULE_NAME: DailyBreathTests
        GENERATE_INFOPLIST_FILE: YES
