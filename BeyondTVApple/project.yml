name: BeyondTV
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
    tvOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    ENABLE_USER_SCRIPT_SANDBOXING: YES
configs:
  Debug: debug
  Release: release
targets:
  BeyondTV-iOS:
    type: application
    platform: iOS
    sources:
      - path: Shared
      - path: Platforms/iOS
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtv
        PRODUCT_NAME: BeyondTV
        PRODUCT_MODULE_NAME: BeyondTVCore
        TARGETED_DEVICE_FAMILY: "1,2"
        SUPPORTS_MACCATALYST: NO
        INFOPLIST_KEY_CFBundleDisplayName: Beyond TV
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
    scheme:
      testTargets:
        - BeyondTVTests
  BeyondTV-tvOS:
    type: application
    platform: tvOS
    sources:
      - path: Shared
      - path: Platforms/tvOS
    resources:
      - path: Resources/Assets.xcassets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtv
        PRODUCT_NAME: BeyondTV
        PRODUCT_MODULE_NAME: BeyondTVCore
        INFOPLIST_KEY_CFBundleDisplayName: Beyond TV
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.entertainment
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
    scheme: {}
  BeyondTVTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeyondTV-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtv.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BeyondTV.app/BeyondTV"
        BUNDLE_LOADER: "$(TEST_HOST)"
