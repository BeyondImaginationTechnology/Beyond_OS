plugins { id 'com.android.application' }

android {
    namespace 'technology.co.beyondimagination.beyond1'
    compileSdk 37

    defaultConfig {
        applicationId 'technology.co.beyondimagination.beyond1'
        minSdk 26
        targetSdk 37
        versionCode providers.gradleProperty('versionCode').map { it.toInteger() }.getOrElse(2)
        versionName providers.gradleProperty('versionName').getOrElse('0.5.1')
    }

    signingConfigs {
        release {
            if (System.getenv()['CI']) {
                storeFile file(System.getenv()['CM_KEYSTORE_PATH'])
                storePassword System.getenv()['CM_KEYSTORE_PASSWORD']
                keyAlias System.getenv()['CM_KEY_ALIAS']
                keyPassword System.getenv()['CM_KEY_PASSWORD']
            }
        }
    }

    buildTypes {
        release {
            if (System.getenv()['CI']) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
