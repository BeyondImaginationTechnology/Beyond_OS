# Manual-only release pipeline for signed DailyBreath TestFlight builds.
#
# Before running, upload the secure files and create the secret variables listed
# in docs/ci/DAILYBREATH_TESTFLIGHT_RELEASE.md. Do not add credentials to Git.
trigger: none
pr: none

parameters:
  - name: iosBuildNumber
    displayName: iOS build number
    type: string
    default: '18'

pool:
  vmImage: macos-15

variables:
  - group: dailybreath-testflight
  - name: projectDirectory
    value: DailyBreathApple

steps:
  - checkout: self
    clean: true

  - task: DownloadSecureFile@1
    name: appStoreConnectKey
    inputs:
      secureFile: AuthKey_WCGDUVCBRB.p8
    displayName: Download App Store Connect API key

  - task: InstallAppleCertificate@2
    inputs:
      certSecureFile: DailyBreath_Distribution.p12
      certPwd: $(APPLE_CERTIFICATE_PASSWORD)
      keychain: temp
      deleteCert: true
    displayName: Install Apple Distribution certificate

  - task: InstallAppleProvisioningProfile@1
    inputs:
      provisioningProfileLocation: secureFiles
      provProfileSecureFile: The_Daily_Breath_Azure_App_Store.mobileprovision
      removeProfile: true
    displayName: Install app provisioning profile

  - task: InstallAppleProvisioningProfile@1
    inputs:
      provisioningProfileLocation: secureFiles
      provProfileSecureFile: DailyBreath_Widget_Azure_App_Store.mobileprovision
      removeProfile: true
    displayName: Install widget provisioning profile

  - task: InstallAppleProvisioningProfile@1
    inputs:
      provisioningProfileLocation: secureFiles
      provProfileSecureFile: DailyBreath_App_Clip_Azure_App_Store.mobileprovision
      removeProfile: true
    displayName: Install App Clip provisioning profile

  - bash: |
      set -euo pipefail
      selected_xcode=""
      selected_version=""
      for xcode_app in /Applications/Xcode_*.app /Applications/Xcode.app; do
        [[ -d "$xcode_app" ]] || continue
        xcode_version="$(DEVELOPER_DIR="$xcode_app/Contents/Developer" xcodebuild -version 2>/dev/null || true)"
        if [[ "$xcode_version" =~ ^Xcode[[:space:]]+([0-9]+)(\.[0-9]+)*$ ]] && (( BASH_REMATCH[1] >= 26 )); then
          candidate_version="${xcode_version#Xcode }"
          if [[ -z "$selected_version" || "$(printf '%s\n%s\n' "$selected_version" "$candidate_version" | sort -V | tail -n 1)" == "$candidate_version" ]]; then
            selected_version="$candidate_version"
            selected_xcode="$xcode_app"
          fi
        fi
      done
      if [[ -z "$selected_xcode" ]]; then
        echo "##vso[task.logissue type=error]Xcode 26 or later is required for App Store Connect uploads."
        exit 1
      fi
      export DEVELOPER_DIR="$selected_xcode/Contents/Developer"
      sdk_version="$(xcrun --sdk iphoneos --show-sdk-version)"
      if [[ ! "$sdk_version" =~ ^([0-9]+)(\.[0-9]+)*$ ]] || (( BASH_REMATCH[1] < 26 )); then
        echo "##vso[task.logissue type=error]The selected Xcode must include the iOS 26 SDK or later. Found iPhoneOS SDK $sdk_version."
        exit 1
      fi
      xcodebuild -version
      simulator_udid="$(xcrun simctl list devices available -j | /usr/bin/ruby -rjson -e '
        devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
        device = devices.find { |candidate| candidate["isAvailable"] && candidate["name"].start_with?("iPhone") }
        abort "No available iPhone simulator was found." unless device
        puts device.fetch("udid")
      ')"
      xcodebuild test \
        -project TheDailyBreath.xcodeproj \
        -scheme "The Daily Breath" \
        -destination "id=$simulator_udid" \
        CODE_SIGNING_ALLOWED=NO
      gem install bundler -v 2.7.2 --no-document
      bundle _2.7.2_ config set path vendor/bundle
      bundle _2.7.2_ install
      bundle _2.7.2_ exec fastlane ios testflight
    workingDirectory: $(projectDirectory)
    env:
      APP_STORE_CONNECT_API_KEY_PATH: $(appStoreConnectKey.secureFilePath)
      APP_STORE_CONNECT_KEY_ID: $(APP_STORE_CONNECT_KEY_ID)
      APP_STORE_CONNECT_ISSUER_ID: $(APP_STORE_CONNECT_ISSUER_ID)
      THE_DAILY_BREATH_PROFILE_NAME: $(THE_DAILY_BREATH_PROFILE_NAME)
      DAILY_BREATH_WIDGET_PROFILE_NAME: $(DAILY_BREATH_WIDGET_PROFILE_NAME)
      DAILY_BREATH_CLIP_PROFILE_NAME: $(DAILY_BREATH_CLIP_PROFILE_NAME)
      # Keep the App Store build sequence independent from Azure's run IDs.
      # Bump this parameter for each new upload; retries of a failed archive
      # may reuse it, but an uploaded build number must never be reused.
      CI_BUILD_NUMBER: ${{ parameters.iosBuildNumber }}
    displayName: Archive and upload DailyBreath to TestFlight
