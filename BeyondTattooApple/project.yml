name: BeyondTattoo
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
    macOS: "14.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
configs:
  Debug: debug
  Release: release
targets:
  BeyondTattoo-iOS:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtattoo
        PRODUCT_NAME: BeyondTattoo
        PRODUCT_MODULE_NAME: BeyondTattoo
        INFOPLIST_KEY_CFBundleDisplayName: Beyond Tattoo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BeyondTattooTests
  BeyondTattoo-macOS:
    type: application
    platform: macOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtattoo.mac
        PRODUCT_NAME: Beyond Tattoo
        PRODUCT_MODULE_NAME: BeyondTattoo
        INFOPLIST_KEY_CFBundleDisplayName: Beyond Tattoo
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.lifestyle
    scheme: {}
  BeyondTattooTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeyondTattoo-iOS
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondtattoo.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/BeyondTattoo.app/BeyondTattoo"
        BUNDLE_LOADER: "$(TEST_HOST)"
