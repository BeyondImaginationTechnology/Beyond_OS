name: BeyondMusic
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: FK9QM3VUNH
    CODE_SIGN_STYLE: Automatic
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.1.1
    SWIFT_VERSION: 6.0
    GENERATE_INFOPLIST_FILE: YES
    ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
targets:
  BeyondMusic:
    type: application
    platform: iOS
    sources:
      - path: Sources
    resources:
      - path: Resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondmusic
        PRODUCT_NAME: BeyondMusic
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Resources/Info.plist
        TARGETED_DEVICE_FAMILY: "1,2"
    scheme:
      testTargets:
        - BeyondMusicTests
  BeyondMusicTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: BeyondMusic
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondmusic.tests
        GENERATE_INFOPLIST_FILE: YES
