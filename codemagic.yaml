workflows:
  daily-breath-keystore-bootstrap:
    name: Daily Breath Keystore Bootstrap
    max_build_duration: 30
    instance_type: mac_mini_m2
    environment:
      groups:
        - daily-breath-keystore-bootstrap
      vars:
        BOOTSTRAP_KEY_ALIAS: daily-breath-upload
    scripts:
      - name: Generate upload keystore
        script: |
          set -euo pipefail
          : "${BOOTSTRAP_KEYSTORE_PASSWORD:?Set BOOTSTRAP_KEYSTORE_PASSWORD as a Codemagic secret}"
          : "${BOOTSTRAP_KEY_PASSWORD:?Set BOOTSTRAP_KEY_PASSWORD as a Codemagic secret}"
          keytool -genkeypair -v \
            -keystore "$CM_BUILD_DIR/daily-breath-upload.jks" \
            -storetype JKS \
            -storepass "$BOOTSTRAP_KEYSTORE_PASSWORD" \
            -keypass "$BOOTSTRAP_KEY_PASSWORD" \
            -alias "$BOOTSTRAP_KEY_ALIAS" \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -dname "CN=Daily Breath, OU=Mobile, O=Beyond Imagination, L=Seattle, ST=Washington, C=US"
    artifacts:
      - daily-breath-upload.jks

  daily-breath-android-play:
    name: Daily Breath Android Google Play
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: DailyBreathAndroid
    environment:
      java: 17
      android_signing:
        - daily-breath-play-upload
      vars:
        ANDROID_VERSION_CODE: 5
        ANDROID_VERSION_NAME: 2.2.0
    scripts:
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/DailyBreathAndroid/local.properties"
      - name: Build signed Google Play App Bundle
        script: |
          set -euo pipefail
          sh ./gradlew --no-daemon \
            --console=plain \
            -PversionCode="$ANDROID_VERSION_CODE" \
            -PversionName="$ANDROID_VERSION_NAME" \
            bundlePlayRelease
    artifacts:
      - app/build/outputs/bundle/playRelease/*.aab
      - app/build/outputs/mapping/playRelease/mapping.txt
  daily-breath-android-debug:
    name: Daily Breath Android Debug APK
    max_build_duration: 45
    instance_type: linux_x2
    working_directory: DailyBreathAndroid
    scripts:
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/DailyBreathAndroid/local.properties"
      - name: Build installable debug APK
        script: |
          set -euo pipefail
          ./gradlew --no-daemon -PversionCode=6 -PversionName=2.1 assemblePlayDebug
    artifacts:
      - app/build/outputs/apk/play/debug/*.apk

  beyond1-android-internal:
    name: Beyond-1 Android Internal testing
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: JaguarAndroid
    environment:
      java: 17
      android_signing:
        - beyond1-play-upload
      vars:
        ANDROID_VERSION_CODE: 2
        ANDROID_VERSION_NAME: 0.5.1
    scripts:
      - name: Set Android SDK location
        script: |
          set -euo pipefail
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$CM_BUILD_DIR/JaguarAndroid/local.properties"
      - name: Build signed Android App Bundle
        script: |
          set -euo pipefail
          ./gradlew --no-daemon --console=plain \
            -PversionCode="$ANDROID_VERSION_CODE" \
            -PversionName="$ANDROID_VERSION_NAME" \
            bundleRelease
    artifacts:
      - app/build/outputs/bundle/release/*.aab
      - app/build/outputs/mapping/release/mapping.txt

  beyond1-ios-testflight:
    name: Beyond-1 iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: JaguarApple
    integrations:
      app_store_connect: beyond-apple-api
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: technology.co.beyondimagination.beyond1
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Configure signing profiles
        script: xcode-project use-profiles
      - name: Set a unique App Store build number
        script: |
          set -euo pipefail
          agvtool new-version -all "$(date +%s)"
      - name: Build signed IPA
        script: |
          set -euo pipefail
          xcode-project build-ipa \
            --project "$CM_BUILD_DIR/JaguarApple/Beyond1.xcodeproj" \
            --scheme Beyond1
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

  beyond1-ios:
    name: Beyond-1 iOS checks
    max_build_duration: 60
    instance_type: mac_mini_m2
    working_directory: JaguarApple
    triggering:
      events:
        - push
      branch_patterns:
        - pattern: main
          include: true
          source: true
    environment:
      xcode: latest
    scripts:
      - name: Generate Xcode project
        script: |
          set -euo pipefail
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Run unit tests
        script: |
          set -euo pipefail
          simulator_id="$(xcrun simctl list devices available -j | ruby -rjson -e '
            devices = JSON.parse(STDIN.read).fetch("devices").values.flatten
            device = devices.find { |candidate| candidate["isAvailable"] && candidate["name"] == "iPhone 16 Pro Max" }
            device ||= devices.find { |candidate| candidate["isAvailable"] && candidate["name"].start_with?("iPhone") }
            abort "No available iPhone simulator found" unless device
            puts device.fetch("udid")
          ')"
          xcodebuild test \
            -project Beyond1.xcodeproj \
            -scheme Beyond1 \
            -destination "id=$simulator_id" \
            CODE_SIGNING_ALLOWED=NO
      - name: Build simulator app
        script: |
          set -euo pipefail
          xcodebuild build \
            -project Beyond1.xcodeproj \
            -scheme Beyond1 \
            -sdk iphonesimulator \
            -derivedDataPath "$CM_BUILD_DIR/derived-data" \
            CODE_SIGNING_ALLOWED=NO
    artifacts:
      - $CM_BUILD_DIR/derived-data/Build/Products/**/*.app
      - /tmp/xcodebuild_logs/*.log

  daily-breath-testflight:
    name: Daily Breath iOS TestFlight
    max_build_duration: 120
    instance_type: mac_mini_m2
    working_directory: DailyBreathApple
    integrations:
      # Create this named App Store Connect integration in Codemagic Team settings.
      app_store_connect: beyond-apple-api
    environment:
      vars:
        APP_STORE_APPLE_ID: 6796850352
      ios_signing:
        distribution_type: app_store
        bundle_identifier: technology.co.beyondimagination.thedailybreath
      xcode: latest
    scripts:
      - name: Configure signing profiles
        script: |
          set -euo pipefail
          xcode-project use-profiles --verbose
      - name: Configure App Store export profiles
        script: |
          set -euo pipefail
          cat > /Users/builder/export_options.plist <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>FK9QM3VUNH</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>technology.co.beyondimagination.thedailybreath</key>
              <string>Daily Breath Codemagic 2026</string>
              <key>technology.co.beyondimagination.thedailybreath.widget</key>
              <string>Daily Breath Widget Codemagic 2026</string>
              <key>technology.co.beyondimagination.thedailybreath.Clip</key>
              <string>Daily Breath App Clip Codemagic 2026</string>
            </dict>
          </dict>
          </plist>
          PLIST
      - name: Set the next App Store build number
        script: |
          set -euo pipefail
          LATEST_BUILD_NUMBER=$(app-store-connect get-latest-app-store-build-number "$APP_STORE_APPLE_ID")
          NEXT_BUILD_NUMBER=$((LATEST_BUILD_NUMBER + 1))
          agvtool new-version -all "$NEXT_BUILD_NUMBER"
      - name: Build signed IPA
        script: |
          set -euo pipefail
          archive_path="$CM_BUILD_DIR/DailyBreathApple/build/ios/xcarchive/TheDailyBreath.xcarchive"
          export_path="$CM_BUILD_DIR/DailyBreathApple/build/ios/ipa"
          rm -rf "$archive_path" "$export_path"
          xcodebuild archive \
            -project "$CM_BUILD_DIR/DailyBreathApple/TheDailyBreath.xcodeproj" \
            -scheme "The Daily Breath" \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$archive_path"
          xcodebuild -exportArchive \
            -archivePath "$archive_path" \
            -exportPath "$export_path" \
            -exportOptionsPlist /Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      app_store_connect:
        auth: integration

