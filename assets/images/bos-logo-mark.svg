<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" role="img" aria-labelledby="title desc">
  <title id="title">Beyond Imagination</title>
  <desc id="desc">A hollow keyhole gateway surrounded by three luminous atomic orbits.</desc>
  <defs>
    <linearGradient id="orbit" x1="7" y1="9" x2="41" y2="39" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#62a5ff"/>
      <stop offset=".48" stop-color="#9a6dff"/>
      <stop offset="1" stop-color="#f05ab8"/>
    </linearGradient>
    <linearGradient id="key" x1="18" y1="16" x2="30" y2="35" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#fff"/>
      <stop offset=".42" stop-color="#ee8de2"/>
      <stop offset="1" stop-color="#7d77ff"/>
    </linearGradient>
    <filter id="glow" x="-70%" y="-70%" width="240%" height="240%">
      <feGaussianBlur stdDeviation="1.15" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <circle cx="24" cy="24" r="9.1" fill="none" stroke="#a786ff" stroke-width=".65" opacity=".26"/>
  <g fill="none" stroke="url(#orbit)" stroke-width="1.15" stroke-linecap="round" opacity=".9">
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7"/>
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7" transform="rotate(60 24 24)"/>
    <ellipse cx="24" cy="24" rx="16.5" ry="5.7" transform="rotate(120 24 24)"/>
  </g>
  <g fill="#f8f4ff" opacity=".92">
    <circle cx="39.8" cy="22.4" r=".72"/>
    <circle cx="15.2" cy="10.8" r=".58"/>
    <circle cx="17.1" cy="38.2" r=".56"/>
  </g>
  <path d="M24 16.2a5.8 5.8 0 0 0-3 10.75l-2.55 7.25h11.1L27 26.95A5.8 5.8 0 0 0 24 16.2Z" fill="none" stroke="url(#key)" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <path d="M21.1 18.1A5.75 5.75 0 0 1 26.8 17" fill="none" stroke="#fff" stroke-width=".55" stroke-linecap="round" opacity=".72"/>
</svg>
