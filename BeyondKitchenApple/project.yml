name: BeyondKitchen
options:
  bundleIdPrefix: technology.co.beyondimagination
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "26.0"
  createIntermediateGroups: true
settings:
  base:
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 0.0.1
    SWIFT_VERSION: 6.0
targets:
  BeyondKitchen:
    type: application
    platform: iOS
    sources: [Sources]
    resources:
      - path: ../beyond-kitchen/data/recipes.json
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: technology.co.beyondimagination.beyondkitchen
        INFOPLIST_KEY_CFBundleDisplayName: Beyond Kitchen
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.food-and-drink
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        TARGETED_DEVICE_FAMILY: "1,2"
